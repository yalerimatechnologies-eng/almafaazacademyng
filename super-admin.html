<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0A0A0A" />
<title>Dashboard · ALMAFAAZ ACADEMY</title>
<link rel="icon" href="assets/images/logo.png" type="image/png" />

<script>
(function(){
  try{
    var saved = localStorage.getItem('almafaaz.theme');
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var prefersDark  = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved === 'light' || saved === 'dark' ? saved
              : (prefersLight ? 'light' : prefersDark ? 'dark' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>

<style>
:root,
[data-theme="dark"]{
  --canvas:#0A0A0A; --surface:#111214; --surface-2:#17191C; --surface-3:#1E2125;
  --surface-hover:#22262B; --line:#232629; --line-2:#2C3034;
  --text:#F5F6F7; --text-2:#B4B8BC; --text-3:#7A8085; --text-4:#4E5358;
  --orange:#FF6B00; --orange-hot:#FF8A2B; --orange-deep:#D95400;
  --orange-soft:rgba(255,107,0,.12); --orange-glow:rgba(255,107,0,.20);
  --green:#1E9E4A; --green-hot:#34B85E; --green-soft:rgba(30,158,74,.12);
  --danger:#E5484D; --danger-soft:rgba(229,72,77,.12);
  --warning:#E8A13A; --warning-soft:rgba(232,161,58,.12);
  --info:#4A9DDB; --info-soft:rgba(74,157,219,.12);
  --backdrop:rgba(0,0,0,.72);
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -20px rgba(0,0,0,.7);
  --shadow-lg:0 40px 80px -20px rgba(0,0,0,.85);
  --shadow-modal:0 50px 100px -20px rgba(0,0,0,.9), 0 30px 60px -20px rgba(0,0,0,.7);
}
[data-theme="light"]{
  --canvas:#F6F3EE; --surface:#FFFFFF; --surface-2:#F4F0E8; --surface-3:#FAF7F1;
  --surface-hover:#EDE7DA; --line:#E5DFD3; --line-2:#D3CCBE;
  --text:#14110D; --text-2:#4A4339; --text-3:#7A7365; --text-4:#A69F92;
  --orange:#E85D00; --orange-hot:#FF7A1F; --orange-deep:#B84800;
  --orange-soft:rgba(232,93,0,.10); --orange-glow:rgba(232,93,0,.18);
  --green:#17803B; --green-hot:#1E9E4A; --green-soft:rgba(23,128,59,.10);
  --danger:#B8342C; --danger-soft:rgba(184,52,44,.10);
  --warning:#B4730A; --warning-soft:rgba(180,115,10,.10);
  --info:#2C6FA6; --info-soft:rgba(44,111,166,.10);
  --backdrop:rgba(20,17,13,.5);
  --shadow-card:0 1px 0 rgba(255,255,255,.9) inset, 0 20px 40px -20px rgba(20,17,13,.15);
  --shadow-lg:0 40px 80px -20px rgba(20,17,13,.25);
  --shadow-modal:0 40px 80px -20px rgba(20,17,13,.35), 0 20px 50px -20px rgba(20,17,13,.25);
}
:root{
  --r-xs:4px; --r-sm:6px; --r:10px; --r-lg:14px; --r-xl:20px;
  --sidebar-w:264px; --header-h:64px;
  --font:Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --font-mono:Consolas, Monaco, "Courier New", monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--font); font-size:15px; line-height:1.5;
  color:var(--text); background:var(--canvas);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition: background .3s var(--ease), color .3s var(--ease);
}
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
a{ color:var(--orange); text-decoration:none; }
a:hover{ text-decoration:underline; }
:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; border-radius:var(--r-xs); }
.skip-link{ position:absolute; top:-100px; left:8px; z-index:9999; padding:10px 16px; background:var(--orange); color:#fff; border-radius:var(--r-sm); font-weight:700; transition: top .2s; }
.skip-link:focus{ top:8px; }

.app{ display:grid; grid-template-columns: var(--sidebar-w) 1fr; min-height:100vh; min-height:100dvh; }

.sidebar{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; height:100vh; height:100dvh;
  position:sticky; top:0; overflow:hidden;
  transition: background .3s var(--ease), border-color .3s var(--ease);
}
.sidebar-brand{ display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); min-height:var(--header-h); flex-shrink:0; }
.sidebar-brand .logo{ width:38px; height:38px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line-2); display:grid; place-items:center; overflow:hidden; flex-shrink:0; }
.sidebar-brand .logo img{ width:70%; height:70%; object-fit:contain; display:block; }
.sidebar-brand .logo .fallback{ font-size:18px; font-weight:800; color:var(--orange); }
.sidebar-brand .name{ display:flex; flex-direction:column; min-width:0; line-height:1.15; }
.sidebar-brand .name strong{ font-size:13px; font-weight:800; letter-spacing:.14em; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-brand .name span{ font-size:10px; letter-spacing:.20em; text-transform:uppercase; color:var(--text-3); font-weight:600; margin-top:3px; }
.sidebar-nav{ flex:1; overflow-y:auto; padding:14px 10px 20px; scrollbar-width:thin; scrollbar-color: var(--line-2) transparent; }
.sidebar-nav::-webkit-scrollbar{ width:6px; }
.sidebar-nav::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:3px; }
.nav-group{ margin-bottom:6px; }
.nav-group-btn{ appearance:none; width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; background:transparent; border:0; border-radius:var(--r-sm); color:var(--text-2); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; text-align:left; transition: color .15s, background .15s; }
.nav-group-btn:hover{ background:var(--surface-2); color:var(--text); }
.nav-group-btn .chev{ margin-left:auto; width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition: transform .2s var(--ease); opacity:.5; }
.nav-group-btn[aria-expanded="true"] .chev{ transform: rotate(90deg); opacity:1; }
.nav-items{ display:flex; flex-direction:column; gap:2px; padding:2px 0 4px; overflow:hidden; max-height:0; transition: max-height .3s var(--ease); }
.nav-group[data-open="true"] .nav-items{ max-height:1000px; }
.nav-item{ appearance:none; width:100%; display:flex; align-items:center; gap:12px; padding:9px 12px 9px 14px; background:transparent; border:0; border-radius:var(--r-sm); color:var(--text-2); font-size:13.5px; font-weight:600; text-align:left; cursor:pointer; transition: color .15s, background .15s; position:relative; text-decoration:none; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); text-decoration:none; }
.nav-item.active{ background:var(--orange-soft); color:var(--orange); }
.nav-item.active::before{ content:""; position:absolute; left:0; top:20%; bottom:20%; width:3px; background:var(--orange); border-radius:0 2px 2px 0; }
.nav-item .ico{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.nav-item .label{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-foot{ padding:14px; border-top:1px solid var(--line); flex-shrink:0; }
.sidebar-foot .session-chip{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r); }
.sidebar-foot .session-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--green-hot); box-shadow: 0 0 0 3px var(--green-soft); flex-shrink:0; }
.sidebar-foot .session-chip .txt{ display:flex; flex-direction:column; min-width:0; line-height:1.3; }
.sidebar-foot .session-chip .txt strong{ font-size:11px; color:var(--text); letter-spacing:.04em; font-weight:700; }
.sidebar-foot .session-chip .txt span{ font-size:10px; color:var(--text-3); letter-spacing:.06em; text-transform:uppercase; font-weight:600; margin-top:2px; }

.main-col{ display:flex; flex-direction:column; min-width:0; min-height:100vh; min-height:100dvh; }
.header{ position:sticky; top:0; z-index:50; height:var(--header-h); display:flex; align-items:center; gap:14px; padding:0 22px; background:var(--surface); border-bottom:1px solid var(--line); transition: background .3s var(--ease), border-color .3s var(--ease); }
.menu-btn{ display:none; appearance:none; width:40px; height:40px; border-radius:var(--r-sm); background:transparent; border:1px solid var(--line-2); color:var(--text-2); place-items:center; }
.menu-btn:hover{ color:var(--text); background:var(--surface-2); }
.menu-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; }
.header-titles{ display:flex; flex-direction:column; min-width:0; line-height:1.2; }
.header-titles .crumb{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); font-weight:700; }
.header-titles h1{ margin:2px 0 0; font-size:17px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(60vw, 480px); }
.header-search{ flex:1; max-width:380px; margin-left:20px; position:relative; }
.header-search input{ width:100%; height:38px; padding:0 12px 0 38px; border-radius:var(--r); background:var(--surface-2); border:1px solid var(--line-2); color:var(--text); font-size:13.5px; outline:none; transition: border-color .15s, background .15s, box-shadow .15s; }
.header-search input::placeholder{ color:var(--text-4); }
.header-search input:focus{ border-color:var(--orange); background:var(--surface); box-shadow: 0 0 0 3px var(--orange-glow); }
.header-search .sicon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--text-3); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.header-actions{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.icon-button{ appearance:none; width:38px; height:38px; border-radius:var(--r-sm); background:transparent; border:1px solid transparent; color:var(--text-2); display:grid; place-items:center; transition: color .15s, background .15s, border-color .15s; position:relative; }
.icon-button:hover{ color:var(--text); background:var(--surface-2); border-color:var(--line-2); }
.icon-button svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.profile-trigger{ display:flex; align-items:center; gap:10px; padding:5px 12px 5px 5px; border-radius:999px; background:transparent; border:1px solid var(--line-2); color:var(--text); transition: background .15s, border-color .15s; margin-left:8px; }
.profile-trigger:hover{ background:var(--surface-2); border-color:var(--orange); }
.profile-trigger .avatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--orange), var(--orange-deep)); color:#fff; display:grid; place-items:center; font-weight:800; font-size:12px; letter-spacing:.02em; flex-shrink:0; }
.profile-trigger .who{ display:flex; flex-direction:column; line-height:1.15; min-width:0; max-width:160px; }
.profile-trigger .who strong{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-trigger .who span{ font-size:10px; color:var(--text-3); font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.workspace{ flex:1; padding:24px 26px 40px; min-width:0; overflow-x:hidden; }
.page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:24px; }
.page-head .left{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.page-head .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.20em; text-transform:uppercase; font-weight:800; color:var(--orange); }
.page-head .eyebrow .live{ width:6px; height:6px; border-radius:50%; background:var(--green-hot); animation: pulse 2s var(--ease) infinite; }
@keyframes pulse{ 0%{ box-shadow: 0 0 0 0 rgba(30,158,74,.55); } 70%{ box-shadow: 0 0 0 10px rgba(30,158,74,0); } 100%{ box-shadow: 0 0 0 0 rgba(30,158,74,0); } }
.page-head h2{ margin:0; font-size:clamp(20px, 2.4vw, 26px); font-weight:800; color:var(--text); letter-spacing:-.005em; line-height:1.2; }
.page-head .sub{ margin:0; font-size:14px; color:var(--text-2); line-height:1.5; max-width:60ch; }
.page-head .right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.btn{ appearance:none; display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 16px; border-radius:var(--r); font-size:13.5px; font-weight:700; letter-spacing:.01em; border:1px solid transparent; transition: background .15s, border-color .15s, color .15s, transform .06s; text-decoration:none; white-space:nowrap; }
.btn:active{ transform: translateY(1px); }
.btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.btn-primary{ background:var(--orange); border-color:var(--orange); color:#fff; box-shadow: 0 6px 18px -8px rgba(255,107,0,.5); }
.btn-primary:hover{ background:var(--orange-hot); border-color:var(--orange-hot); text-decoration:none; }
.btn-ghost{ background:var(--surface); border-color:var(--line-2); color:var(--text); }
.btn-ghost:hover{ border-color:var(--orange); color:var(--orange); text-decoration:none; }
.btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-danger:hover{ background:var(--danger); border-color:var(--danger); opacity:.9; }
.btn-sm{ height:32px; padding:0 12px; font-size:12.5px; }
.btn[disabled]{ opacity:.55; cursor:not-allowed; }

.metrics{ display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:14px; margin-bottom:24px; }
@media (max-width:1200px){ .metrics{ grid-template-columns: repeat(3, 1fr); } }
@media (max-width:720px){ .metrics{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width:420px){ .metrics{ grid-template-columns: 1fr; } }
.metric{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; transition: border-color .15s, transform .15s; }
.metric:hover{ border-color:var(--line-2); }
.metric .head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.metric .head .label{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--text-3); }
.metric .head .ico-wrap{ width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:var(--orange-soft); color:var(--orange); }
.metric .head .ico-wrap svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.metric.green .ico-wrap{ background:var(--green-soft); color:var(--green); }
.metric.info .ico-wrap{ background:var(--info-soft); color:var(--info); }
.metric.warning .ico-wrap{ background:var(--warning-soft); color:var(--warning); }
.metric .value{ font-size:30px; font-weight:800; color:var(--text); line-height:1; letter-spacing:-.01em; }
.metric .value.muted{ color:var(--text-3); font-size:24px; }
.metric .foot{ font-size:12px; color:var(--text-3); font-weight:600; }
.metric.loading .value{ display:inline-block; width:70px; height:30px; border-radius:6px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce){
  .metric.loading .value{ animation:none; background:var(--surface-2); }
  .page-head .eyebrow .live{ animation:none; }
}

.content-grid{ display:grid; grid-template-columns: 2fr 1fr; gap:20px; align-items:start; }
@media (max-width:1024px){ .content-grid{ grid-template-columns: 1fr; } }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; transition: border-color .15s; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.panel-head .titles h3{ margin:0; font-size:14px; font-weight:800; color:var(--text); letter-spacing:.005em; }
.panel-head .titles p{ margin:4px 0 0; font-size:12.5px; color:var(--text-3); }
.panel-head .actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.panel-body{ padding:20px; }
.panel-body.flush{ padding:0; }
.panel-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }

.empty{ text-align:center; padding:36px 24px; }
.empty .ico-wrap{ width:56px; height:56px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line-2); color:var(--text-3); display:grid; place-items:center; margin:0 auto 16px; }
.empty .ico-wrap svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.empty h4{ margin:0 0 6px; font-size:14px; font-weight:700; color:var(--text); }
.empty p{ margin:0 auto 16px; font-size:13px; color:var(--text-3); max-width:36ch; line-height:1.55; }

.activity-list{ display:flex; flex-direction:column; }
.activity-row{ display:flex; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); align-items:flex-start; }
.activity-row:last-child{ border-bottom:0; }
.activity-row .dot-col{ display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:4px; }
.activity-row .dot-col .dot{ width:8px; height:8px; border-radius:50%; background:var(--orange); flex-shrink:0; }
.activity-row .text{ flex:1; min-width:0; }
.activity-row .text .line{ font-size:13px; color:var(--text); font-weight:600; line-height:1.45; }
.activity-row .text .line .actor{ color:var(--orange); font-weight:700; }
.activity-row .text .line .target{ color:var(--text); font-weight:700; }
.activity-row .text .meta{ display:flex; align-items:center; gap:8px; margin-top:4px; font-size:11.5px; color:var(--text-3); font-weight:600; letter-spacing:.02em; }
.activity-row .text .meta .sep{ width:3px; height:3px; border-radius:50%; background:var(--text-4); }
.qa-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
@media (max-width:520px){ .qa-grid{ grid-template-columns: 1fr; } }
.qa{ appearance:none; display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r); color:var(--text); text-align:left; transition: border-color .15s, background .15s, transform .08s; }
.qa:hover{ border-color:var(--orange); background:var(--surface-3); }
.qa:active{ transform: translateY(1px); }
.qa .ico{ width:32px; height:32px; border-radius:8px; background:var(--orange-soft); color:var(--orange); display:grid; place-items:center; flex-shrink:0; }
.qa .ico svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.qa .label{ font-size:13px; font-weight:700; color:var(--text); line-height:1.3; }
.status-list{ display:flex; flex-direction:column; }
.status-row{ display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
.status-row:last-child{ border-bottom:0; }
.status-row .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.status-row .dot.green{ background:var(--green-hot); box-shadow: 0 0 0 3px var(--green-soft); }
.status-row .dot.orange{ background:var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.status-row .dot.gray{ background:var(--text-4); }
.status-row .text{ flex:1; font-size:13px; color:var(--text); font-weight:600; }
.status-row .state{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); font-weight:800; }
.status-row .state.ok{ color:var(--green); }
.status-row .state.warn{ color:var(--warning); }
.section-title{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 14px; }
.section-title h3{ margin:0; font-size:15px; font-weight:800; color:var(--text); letter-spacing:.02em; }
.section-title h3 .accent{ display:inline-block; width:4px; height:14px; background:var(--orange); border-radius:2px; margin-right:10px; vertical-align:middle; }

.modal{ position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; visibility:hidden; pointer-events:none; }
.modal.open{ visibility:visible; pointer-events:auto; }
.modal .modal-backdrop{ position:absolute; inset:0; background:var(--backdrop); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity:0; transition: opacity .22s var(--ease); }
.modal.open .modal-backdrop{ opacity:1; }

.auth-gate{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--canvas); transition: opacity .4s var(--ease), visibility .4s; }

function svg(name){
  const path = ICONS[name] || ICONS.home;
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
}

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('almafaaz.theme', theme); }catch(e){}
  const next = theme === 'dark' ? 'light' : 'dark';
  themeMenuLabel.textContent = `Switch to ${next}`;
  themeBtn.setAttribute('aria-label', `Switch to ${next} theme`);
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
themeBtn.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
themeMenuItem.addEventListener('click', () => { setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); closeProfileMenu(); });
setTheme(currentTheme());

function openDrawer(){ sidebar.classList.add('open'); backdrop.classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ sidebar.classList.remove('open'); backdrop.classList.remove('open'); document.body.style.overflow=''; }
menuBtn.addEventListener('click', openDrawer);
backdrop.addEventListener('click', closeDrawer);

function openProfileMenu(){ profileMenu.classList.add('open'); profileMenu.setAttribute('aria-hidden','false'); profileTrigger.setAttribute('aria-expanded','true'); }
function closeProfileMenu(){ profileMenu.classList.remove('open'); profileMenu.setAttribute('aria-hidden','true'); profileTrigger.setAttribute('aria-expanded','false'); }
profileTrigger.addEventListener('click', (e) => { e.stopPropagation(); profileMenu.classList.contains('open') ? closeProfileMenu() : openProfileMenu(); });
document.addEventListener('click', (e) => { if (!profileMenu.contains(e.target) && e.target !== profileTrigger) closeProfileMenu(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ closeProfileMenu(); closeDrawer(); if (modalEl.classList.contains('open')) closeModal(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !modalEl.classList.contains('open')){
    e.preventDefault(); searchInput && searchInput.focus();
  }
});
profileMenu.querySelectorAll('[data-nav]').forEach(el => {
  el.addEventListener('click', () => { navigate(el.dataset.nav); closeProfileMenu(); });
});

logoutBtn.addEventListener('click', async () => {
  logoutBtn.disabled = true;
  try{ await supabase.auth.signOut(); }catch(_){}
  try{ localStorage.removeItem('almafaaz.auth'); }catch(_){}
  window.location.replace('index.html');
});

function toast(type, title, body){
  const host = $('toast-host');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const iconName = type === 'success' ? 'check' : type === 'error' ? 'trash' : type === 'warning' ? 'bell' : 'check';
  el.innerHTML = `${svg(iconName)}<div class="msg"><strong>${escapeHtml(title)}</strong>${body ? `<span>${escapeHtml(body)}</span>` : ''}</div>`;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 4200);
}

function openModal({ title, subtitle, body, footer, size }){
  modalTitle.textContent = title || '';
  modalSub.textContent = subtitle || '';
  modalSub.style.display = subtitle ? '' : 'none';
  modalBody.innerHTML = body || '';
  modalFoot.innerHTML = footer || '';
  modalEl.classList.remove('modal-sm','modal-lg');
  if (size === 'sm') modalEl.classList.add('modal-sm');
  if (size === 'lg') modalEl.classList.add('modal-lg');
  modalEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => { modalEl.querySelector('input,select,textarea,button:not([data-close-modal])')?.focus(); }, 80);
}
function closeModal(){
  modalEl.classList.remove('open');
  document.body.style.overflow = '';
  modalBody.innerHTML = '';
  modalFoot.innerHTML = '';
}
modalEl.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeModal));
modalEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const focusables = modalEl.querySelectorAll('input,select,textarea,button,[tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

function confirmDialog({ title, message, confirmLabel='Delete', danger=true, onConfirm }){
  openModal({
    title, subtitle:'', size:'sm',
    body: `<p style="margin:0;color:var(--text-2);font-size:14px;line-height:1.6;">${escapeHtml(message)}</p>`,
    footer: `<button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
             <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modal-confirm">${escapeHtml(confirmLabel)}</button>`
  });
  $('modal-confirm').addEventListener('click', async () => {
    const btn = $('modal-confirm');
    btn.disabled = true; btn.textContent = 'Working…';
    try{ await onConfirm(); closeModal(); }
    catch(err){ btn.disabled = false; btn.textContent = confirmLabel; console.error('[confirm] error', err); }
  });
}

function renderSidebar(){
  const nav = $('sidebar-nav');
  nav.innerHTML = NAV.map(group => `
    <div class="nav-group" data-open="${group.open ? 'true' : 'false'}">
      <button type="button" class="nav-group-btn" aria-expanded="${group.open ? 'true' : 'false'}" data-group="${group.id}">
        <span>${group.label}</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <div class="nav-items">
        ${group.items.map(it => `
          <a class="nav-item" data-route="${it.route}" href="#${it.route}">
            <span class="ico">${svg(it.icon)}</span>
            <span class="label">${it.label}</span>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-group-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.closest('.nav-group');
      const open = group.dataset.open === 'true';
      group.dataset.open = open ? 'false' : 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
  });
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(item.dataset.route);
      if (window.innerWidth <= 900) closeDrawer();
    });
  });
  highlightActiveNav();
}

function highlightActiveNav(){
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route === state.route));
}

function navigate(route){ state.route = route; window.location.hash = route; render(); }
window.addEventListener('hashchange', () => { state.route = window.location.hash.replace(/^#/, '') || 'dashboard'; render(); });
function findNavMeta(route){
  for (const group of NAV) for (const item of group.items) if (item.route === route) return { group: group.label, item };
  return null;
}

function render(){
  const meta = findNavMeta(state.route);
  if (!meta){ state.route = 'dashboard'; return render(); }
  crumb.textContent = meta.group;
  pageTitle.textContent = meta.item.label;

    loadCount('students','students','students registered'),

    loadCount('cbt','cbt_examinations','CBT examinations'),

async function loadCount(metricId, table, noun){
  const valueEl = document.querySelector(`[data-value="${metricId}"]`);
  const footEl  = document.querySelector(`[data-foot="${metricId}"]`);
  if (!valueEl) return;
  try{
    const { count, error } = await supabase.from(table).select('*', { count:'exact', head:true });
    if (error) throw error;
    valueEl.classList.remove('loading');
    valueEl.textContent = count ?? 0;
    if (count === 0){ valueEl.classList.add('muted'); if (footEl) footEl.textContent = `No ${noun} yet`; }
    else { if (footEl) footEl.textContent = noun; }
  } catch(err){
    console.error(`[dashboard] count(${table}) failed`, err);
    valueEl.classList.remove('loading'); valueEl.textContent = '—';
    if (footEl) footEl.textContent = 'Unable to load';
  }
}

async function loadAcademicContext(){
  try{
    const [{ data: session }, { data: term }] = await Promise.all([
      supabase.from('academic_sessions').select('name').eq('is_active', true).maybeSingle(),
      supabase.from('terms').select('name').eq('is_active', true).maybeSingle()
    ]);
    const sName = session?.name || null;
    const tName = term?.name || null;
    state.sessionName = sName; state.termName = tName;
    const set = (id, val, fallback) => { const el = $(id); if (el) el.textContent = val || fallback; };
    set('session-name', sName ? `${sName} session` : 'No active session', 'No active session');
    set('session-term', tName ? tName : 'Set up academics', 'Set up academics');
    set('ctx-session', sName, '—'); set('ctx-term', tName, '—');
    const sSess = $('status-session'), sTerm = $('status-term');
    if (sSess){ sSess.textContent = sName || 'Not set'; sSess.className = 'state ' + (sName ? 'ok' : 'warn'); }
    if (sTerm){ sTerm.textContent = tName || 'Not set'; sTerm.className = 'state ' + (tName ? 'ok' : 'warn'); }
  } catch(err){ console.error('[dashboard] academic context failed', err); }
}

async function loadSessions(){
  const host = $('sessions-host'); if (!host) return;
  const bar = $('sessions-refresh-bar'); bar?.classList.add('show');
  try{
    const { data: sessions, error } = await supabase.from('academic_sessions')
      .select('id, name, start_date, end_date, is_active, created_at')
      .order('is_active', { ascending: false }).order('created_at', { ascending:false });
    if (error) throw error;
    state.sessions = sessions || [];
    if (state.sessions.length){
      const ids = state.sessions.map(s => s.id);
      const { data: terms, error: tErr } = await supabase.from('terms')
        .select('id, name, academic_session_id, start_date, end_date, is_active')
        .in('academic_session_id', ids).order('created_at', { ascending:true });
      if (tErr) throw tErr;
      state.termsBySession = {};
      (terms || []).forEach(t => {
        if (!state.termsBySession[t.academic_session_id]) state.termsBySession[t.academic_session_id] = [];
        state.termsBySession[t.academic_session_id].push(t);
      });
    } else { state.termsBySession = {}; }
    renderSessionsList();
  } catch(err){
    console.error('[sessions] load failed', err);
    host.innerHTML = `<div class="panel"><div class="panel-body flush"><div class="empty"><div class="ico-wrap">${svg('database')}</div><h4>Unable to load sessions</h4><p>There was a problem reaching the server. Please refresh or try again in a moment.</p></div></div></div>`;
  } finally { bar?.classList.remove('show'); }
}

function renderSessionsList(){
  const host = $('sessions-host'); if (!host) return;
  if (!state.sessions.length){
    host.innerHTML = `<div class="panel"><div class="panel-body flush"><div class="empty"><div class="ico-wrap">${svg('calendar')}</div><h4>No academic sessions yet</h4><p>Create your first academic session — for example <strong>2026/2027</strong> — to start structuring the school year.</p><button class="btn btn-primary" type="button" onclick="document.getElementById('sessions-new')?.click()">${svg('plus')} Create first session</button></div></div></div>`;
    return;
  }
  host.innerHTML = `<div class="sessions-list">${state.sessions.map(sessionCard).join('')}</div>`;
  host.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const action = btn.dataset.action, id = btn.dataset.id;
      if (action === 'toggle-terms') toggleSessionTerms(id);
      else if (action === 'activate-session') await activateSession(id);
      else if (action === 'edit-session') openSessionForm(state.sessions.find(s => s.id === id));
      else if (action === 'delete-session') await deleteSession(id);
      else if (action === 'add-term') openTermForm(id);
      else if (action === 'edit-term') openTermForm(btn.dataset.sessionId, state.termsBySession[btn.dataset.sessionId]?.find(t => t.id === id));
      else if (action === 'activate-term') await activateTerm(id, btn.dataset.sessionId);
      else if (action === 'delete-term') await deleteTerm(id, btn.dataset.sessionId);
    });
  });
}

async function saveSession(existing){
  const name = $('sess-name').value.trim();
  const start = $('sess-start').value || null;
  const end = $('sess-end').value || null;
  const active = $('sess-active').checked;
  if (!name){ $('err-sess-name').classList.add('show'); $('sess-name').classList.add('invalid'); $('sess-name').focus(); return; }
  const btn = $('sess-save'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
  try{
    if (active){
      await supabase.from('academic_sessions').update({ is_active: false }).eq('is_active', true).neq('id', existing?.id || '00000000-0000-0000-0000-000000000000');
    }
    if (existing){
      const { error } = await supabase.from('academic_sessions').update({ name, start_date: start, end_date: end, is_active: active }).eq('id', existing.id);
      if (error) throw error;
      toast('success', 'Session updated', `${name} has been saved.`);
    } else {
      const { error } = await supabase.from('academic_sessions').insert({ name, start_date: start, end_date: end, is_active: active });
      if (error) throw error;
      toast('success', 'Session created', `${name} has been added.`);
    }
    closeModal(); await loadSessions(); loadAcademicContext();
  } catch(err){
    console.error('[sessions] save failed', err);
    const msg = (err?.message || '').toLowerCase();
    if (msg.includes('duplicate') || msg.includes('unique')) toast('error','Duplicate session','A session with this name already exists.');
    else toast('error','Could not save','Please try again in a moment.');
    btn.disabled = false; btn.textContent = orig;
  }
}

async function activateSession(id){

  try{
    await supabase.from('academic_sessions').update({ is_active: false }).eq('is_active', true);
    const { error } = await supabase.from('academic_sessions').update({ is_active: true }).eq('id', id);
    if (error) throw error;
    toast('success','Session activated',`${session.name} is now the active session.`);
    await loadSessions(); loadAcademicContext();
  } catch(err){ console.error('[sessions] activate failed', err); toast('error','Could not activate','Please try again.'); }
}

async function deleteSession(id){
  const session = state.sessions.find(s => s.id === id); if (!session) return;
  if (session.is_active){ toast('warning','Cannot delete active session','Deactivate it first, or activate a different session.'); return; }
  const termCount = (state.termsBySession[id] || []).length;
  confirmDialog({
    title: `Delete "${session.name}"?`,
    message: termCount > 0 ? `This session contains ${termCount} term${termCount === 1 ? '' : 's'}. Deleting it will remove all its terms. This cannot be undone.` : `This will permanently remove the session. This cannot be undone.`,
    confirmLabel: 'Delete session',
    onConfirm: async () => {
      const { error } = await supabase.from('academic_sessions').delete().eq('id', id);
      if (error) throw error;
      state.expandedSessions.delete(id);
      toast('success','Session deleted',`${session.name} has been removed.`);
      await loadSessions();
    }
  });
}

async function saveTerm(sessionId, existing){
  const name = $('term-name').value.trim();
  const start = $('term-start').value || null;
  const end = $('term-end').value || null;
  const active = $('term-active').checked;
  if (!name){ $('err-term-name').classList.add('show'); $('term-name').classList.add('invalid'); $('term-name').focus(); return; }
  const btn = $('term-save'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
  try{
    if (active){
      await supabase.from('terms').update({ is_active: false }).eq('is_active', true).neq('id', existing?.id || '00000000-0000-0000-0000-000000000000');
    }
    if (existing){
      const { error } = await supabase.from('terms').update({ name, start_date: start, end_date: end, is_active: active }).eq('id', existing.id);
      if (error) throw error;
      toast('success','Term updated',`${name} has been saved.`);
    } else {
      const { error } = await supabase.from('terms').insert({ academic_session_id: sessionId, name, start_date: start, end_date: end, is_active: active });
      if (error) throw error;
      toast('success','Term added',`${name} has been added.`);
    }
    closeModal(); state.expandedSessions.add(sessionId); await loadSessions(); loadAcademicContext();
  } catch(err){ console.error('[terms] save failed', err); toast('error','Could not save','Please try again in a moment.'); btn.disabled = false; btn.textContent = orig; }
}

async function activateTerm(id, sessionId){
  try{
    await supabase.from('terms').update({ is_active: false }).eq('is_active', true);
    const { error } = await supabase.from('terms').update({ is_active: true }).eq('id', id);
    if (error) throw error;
    toast('success','Term activated','The selected term is now active.');
    await loadSessions(); loadAcademicContext();
  } catch(err){ console.error('[terms] activate failed', err); toast('error','Could not activate term','Please try again.'); }
}

async function deleteTerm(id, sessionId){
  const term = (state.termsBySession[sessionId] || []).find(t => t.id === id); if (!term) return;
  if (term.is_active){ toast('warning','Cannot delete active term','Deactivate it first, or activate a different term.'); return; }
  confirmDialog({
    title: `Delete "${term.name}"?`,
    message: `This will permanently remove this term. This cannot be undone.`,
    confirmLabel: 'Delete term',
    onConfirm: async () => {
      const { error } = await supabase.from('terms').delete().eq('id', id);
      if (error) throw error;
      toast('success','Term deleted',`${term.name} has been removed.`);
      await loadSessions();
    }
  });
}

async function loadClasses(){
  try{
    const { data, error } = await supabase.from('classes')
      .select('id, name, level, is_active')
      .eq('is_active', true)
      .order('name', { ascending: true });
    if (error) throw error;
    state.classes = data || [];
    const sel = $('students-filter-class');
    if (sel){
      sel.innerHTML = `<option value="">All classes</option>` +
        state.classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      sel.value = state.studentFilterClass;
    }
  } catch(err){
    console.error('[students] load classes failed', err);
    state.classes = [];
  }
}

async function loadStudents(){
  const host = $('students-host'); if (!host) return;
  const bar = $('students-refresh-bar'); bar?.classList.add('show');
  host.innerHTML = `<div class="empty"><div class="ico-wrap">${svg('users')}</div><h4>Loading students…</h4></div>`;
  try{
    const { data, error } = await supabase.from('students')
      .select('id, admission_number, full_name, first_name, last_name, gender, date_of_birth, class_id, arm, parent_name, parent_phone, parent_email, address, status, is_demo, created_at')
      .order('created_at', { ascending:false });
    if (error) throw error;
    state.students = data || [];
    state.studentsLoaded = true;
    renderStudentsTable();
  } catch(err){
    console.error('[students] load failed', err);
    host.innerHTML = `<div class="empty"><div class="ico-wrap">${svg('database')}</div><h4>Unable to load students</h4><p>There was a problem reaching the server. Please refresh or try again in a moment.</p></div>`;
  } finally { bar?.classList.remove('show'); }
}

function filterStudents(){
  const q = state.studentSearch;
  const cid = state.studentFilterClass;
  const st = state.studentFilterStatus;
  return state.students.filter(s => {
    if (cid && s.class_id !== cid) return false;
    if (st && s.status !== st) return false;
    if (q){
      const hay = `${s.full_name||''} ${s.admission_number||''} ${s.parent_name||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStudentsTable(){
  const host = $('students-host'); if (!host) return;
  const foot = $('students-foot');
  const countEl = $('students-count');
  const pageinfo = $('students-pageinfo');
  const pager = $('students-pager');

  const filtered = filterStudents();

  if (countEl){
    const demoCount = filtered.filter(s => s.is_demo).length;
    countEl.textContent = filtered.length === 0
      ? (state.students.length === 0 ? 'No students yet' : 'No students match your filters')
      : `${filtered.length} student${filtered.length === 1 ? '' : 's'}${demoCount ? ` · ${demoCount} demo` : ''}`;
  }

  if (filtered.length === 0){
    host.innerHTML = `
      <div class="empty">
        <div class="ico-wrap">${svg('users')}</div>
        <h4>${state.students.length === 0 ? 'No students registered yet' : 'No students match your filters'}</h4>
        <p>${state.students.length === 0
          ? 'Register the first student to start building the school record.'
          : 'Try adjusting your search or filters to find the student you are looking for.'}</p>
        ${state.students.length === 0 ? `<button class="btn btn-primary" type="button" id="students-empty-new">${svg('plus')} Add first student</button>` : ''}
      </div>`;
    const b = $('students-empty-new');
    if (b) b.addEventListener('click', () => openStudentForm());
    foot.style.display = 'none';
    return;
  }

  const perPage = state.studentPerPage;
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  if (state.studentPage > totalPages) state.studentPage = totalPages;
  const start = (state.studentPage - 1) * perPage;
  const pageItems = filtered.slice(start, start + perPage);

  host.innerHTML = `
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Admission #</th>
            <th>Class</th>
            <th>Gender</th>
            <th>Parent contact</th>
            <th>Status</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${pageItems.map(s => studentRow(s)).join('')}
        </tbody>
      </table>
    </div>`;

  host.querySelectorAll('[data-saction]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.saction;
      const id = btn.dataset.id;
      const stu = state.students.find(x => x.id === id);
      if (!stu) return;
      if (action === 'view') viewStudent(stu);
      else if (action === 'edit') openStudentForm(stu);
      else if (action === 'delete') deleteStudent(stu);
    });
  });

  foot.style.display = 'flex';
  if (pageinfo) pageinfo.textContent = `Showing ${start + 1}–${Math.min(start + perPage, total)} of ${total}`;
  if (pager){
    pager.innerHTML = `
      <button type="button" id="stu-prev" ${state.studentPage <= 1 ? 'disabled' : ''}>Prev</button>
      <span class="pagenum">${state.studentPage} / ${totalPages}</span>
      <button type="button" id="stu-next" ${state.studentPage >= totalPages ? 'disabled' : ''}>Next</button>`;
    $('stu-prev').addEventListener('click', () => { if (state.studentPage > 1){ state.studentPage--; renderStudentsTable(); } });
    $('stu-next').addEventListener('click', () => { if (state.studentPage < totalPages){ state.studentPage++; renderStudentsTable(); } });
  }
}

      </div>

      <div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--orange);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line);">Parent / Guardian</div>
      <div class="form-row"><label class="form-label" for="stu-pname">Parent name</label><input class="form-input" id="stu-pname" type="text" value="${escapeHtml(student?.parent_name || '')}" /></div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label" for="stu-pphone">Parent phone</label><input class="form-input" id="stu-pphone" type="tel" value="${escapeHtml(student?.parent_phone || '')}" /></div>
        <div class="form-row"><label class="form-label" for="stu-pemail">Parent email</label><input class="form-input" id="stu-pemail" type="email" value="${escapeHtml(student?.parent_email || '')}" /></div>
      </div>
      <div class="form-row"><label class="form-label" for="stu-address">Home address</label><textarea class="form-textarea" id="stu-address" rows="2" style="min-height:70px;">${escapeHtml(student?.address || '')}</textarea></div>
    `,
    footer: `<button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button type="button" class="btn btn-primary" id="stu-save">${isEdit ? 'Save changes' : 'Register student'}</button>`
  });

  $('stu-save').addEventListener('click', () => saveStudent(student));
}

async function saveStudent(existing){
  const first = $('stu-first').value.trim();
  const last  = $('stu-last').value.trim();
  const adm   = $('stu-adm').value.trim();
  const dob   = $('stu-dob').value || null;
  const gender = $('stu-gender').value || null;
  const status = $('stu-status').value || 'active';
  const classId = $('stu-class').value || null;
  const arm    = $('stu-arm').value.trim() || null;
  const pname  = $('stu-pname').value.trim() || null;
  const pphone = $('stu-pphone').value.trim() || null;
  const pemail = $('stu-pemail').value.trim() || null;
  const addr   = $('stu-address').value.trim() || null;

  const nameErr = $('err-stu-name');
  let bad = false;
  if (!first || !last){
    nameErr.classList.add('show');
    $('stu-first').classList.toggle('invalid', !first);
    $('stu-last').classList.toggle('invalid', !last);
    bad = true;
  } else { nameErr.classList.remove('show'); $('stu-first').classList.remove('invalid'); $('stu-last').classList.remove('invalid'); }
  if (!adm){
    $('stu-adm').classList.add('invalid');
    bad = true;
  } else { $('stu-adm').classList.remove('invalid'); }
  if (bad){ (!$('stu-first').value.trim() ? $('stu-first') : $('stu-adm')).focus(); return; }

  const fullName = `${first} ${last}`;
  const payload = {
    first_name: first, last_name: last, full_name: fullName,
    admission_number: adm, date_of_birth: dob, gender, status,
    class_id: classId, arm, parent_name: pname, parent_phone: pphone,
    parent_email: pemail, address: addr
  };

  const btn = $('stu-save'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
  try{
    if (existing){
      const { error } = await supabase.from('students').update(payload).eq('id', existing.id);
      if (error) throw error;
      toast('success', 'Student updated', `${fullName}'s record has been saved.`);
    } else {
      const { error } = await supabase.from('students').insert(payload);
      if (error) throw error;
      toast('success', 'Student registered', `${fullName} has been added to the register.`);
    }
    closeModal();
    await loadStudents();
  } catch(err){
    console.error('[students] save failed', err);
    const msg = (err?.message || '').toLowerCase();
    if (msg.includes('duplicate') || msg.includes('unique')){
      toast('error', 'Duplicate admission number', 'Another student already has this admission number.');
      $('stu-adm').classList.add('invalid');
      $('stu-adm').focus();
    } else {
      toast('error', 'Could not save', 'Please check your details and try again.');
    }
    btn.disabled = false; btn.textContent = orig;
  }
}

function deleteStudent(s){
  confirmDialog({
    title: `Delete "${s.full_name}"?`,
    message: `This will permanently remove this student's record from the academy. This cannot be undone. Consider archiving instead if the record must be preserved.`,
    confirmLabel: 'Delete student',
    onConfirm: async () => {
      const { error } = await supabase.from('students').delete().eq('id', s.id);
      if (error) throw error;
      toast('success', 'Student deleted', `${s.full_name} has been removed.`);
      await loadStudents();
    }
  });
}

function deleteAllDemoStudents(){
  const demoCount = state.students.filter(s => s.is_demo).length;
  if (demoCount === 0){
    toast('warning', 'No demo students', 'There are no demo students to delete.');
    return;
  }
  confirmDialog({
    title: `Delete all ${demoCount} demo student${demoCount === 1 ? '' : 's'}?`,
    message: `This will permanently remove every student that was flagged as demo data. Real students are not affected. This cannot be undone.`,
    confirmLabel: `Delete ${demoCount} demo`,
    onConfirm: async () => {
      const { error } = await supabase.from('students').delete().eq('is_demo', true);
      if (error) throw error;
      toast('success', 'Demo students deleted', `${demoCount} demo record${demoCount === 1 ? '' : 's'} removed.`);
      await loadStudents();
    }
  });
}

function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function humanAction(action){
  if (!action) return 'performed an action';
  const map = {
    'user.created': 'created an account for', 'user.role_changed': 'changed the role of',
    'user.activated': 'activated the account of', 'user.deactivated': 'deactivated the account of',
    'user.password_reset': 'reset the password for', 'user.deleted': 'deleted the account of',
    'student.created': 'registered a student', 'student.updated': 'updated the record of',
    'student.deleted': 'removed the record of'
  };
  return map[action] || action.replace(/[._]/g,' ');
}
function timeAgo(iso){
  try{
    const then = new Date(iso).getTime(), now = Date.now();
    const sec = Math.floor((now - then) / 1000);
    if (sec < 45) return 'just now';
    const min = Math.floor(sec / 60); if (min < 60) return `${min} min ago`;
    const hr = Math.floor(min / 60); if (hr < 24) return `${hr} hr${hr === 1 ? '' : 's'} ago`;
    const d = Math.floor(hr / 24); if (d < 30) return `${d} day${d === 1 ? '' : 's'} ago`;
    return new Date(iso).toLocaleDateString();
  } catch(_){ return '—'; }
}
function formatDateRange(start, end){
  if (!start && !end) return 'No dates set';
  const fmt = (d) => {
    if (!d) return '—';
    try{ return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
    catch(_){ return d; }
  };
  return `${fmt(start)} — ${fmt(end)}`;
}
function formatDate(d){
  if (!d) return '—';
  try{ return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  catch(_){ return d; }
}
function getInitials(name){
  if (!name) return '?';
  const parts = name.trim().split(/\s+/).slice(0,2);
  return parts.map(p => p[0]).join('').toUpperCase();
}
function debounce(fn, ms){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

async function boot(){
  try{
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user) return redirectToLogin('no-session');
    const { data: rows, error: rpcErr } = await supabase.rpc('get_my_profile');
    if (rpcErr){ console.error('[dashboard] get_my_profile failed', rpcErr); return redirectToLogin('profile-error'); }
    const profile = Array.isArray(rows) ? rows[0] : rows;
    if (!profile) return redirectToLogin('no-profile');
    if (!profile.is_active) return redirectToLogin('inactive');
    if (profile.role !== 'super_admin') return redirectToLogin('not-super-admin');
    state.user = session.user; state.profile = profile;
    populateIdentity(profile);
    renderSidebar();
    render();
    authGate.classList.add('done');
    app.style.display = 'grid';
    const hash = window.location.hash.replace(/^#/, '');
    if (hash && hash !== state.route) navigate(hash);
  } catch(err){ console.error('[dashboard] boot failed', err); redirectToLogin('boot-failed'); }
}

function populateIdentity(profile){
  const name = profile.full_name || profile.email || 'Super Admin';
  const email = profile.email || '—';
  const role = profile.role === 'super_admin' ? 'Super Administrator' : profile.role;
  const initials = (name.match(/\b\w/g) || ['S','A']).slice(0,2).join('').toUpperCase();
  $('avatar-initials').textContent = initials;
  $('profile-name').textContent = name;
  $('profile-role').textContent = role;
  $('menu-name').textContent = name;
  $('menu-email').textContent = email;
  const w = $('welcome-line');
  if (w){
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    w.textContent = `${greet}, ${name.split(' ')[0]}`;
  }
}
function redirectToLogin(reason){
  console.warn('[dashboard] redirecting to login:', reason);
  try{ window.location.replace('index.html'); }catch(_){}
}
supabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') redirectToLogin('signed-out'); });

boot();
</script>
