<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0A0A0A" />
<title>Dashboard · ALMAFAAZ ACADEMY</title>
<link rel="icon" href="../assets/images/logo.png" type="image/png" />

<script>
/* Apply theme before first paint */
(function(){
  try{
    var saved = localStorage.getItem('almafaaz.theme');
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var prefersDark  = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved === 'light' || saved === 'dark' ? saved
              : (prefersLight ? 'light' : prefersDark ? 'dark' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>

<style>
/* ============================================================
   ALMAFAAZ — Design Tokens
   ============================================================ */

/* DARK */
:root,
[data-theme="dark"]{
  --canvas:       #0A0A0A;
  --surface:      #111214;
  --surface-2:    #17191C;
  --surface-3:    #1E2125;
  --surface-hover:#22262B;

  --line:         #232629;
  --line-2:       #2C3034;

  --text:         #F5F6F7;
  --text-2:       #B4B8BC;
  --text-3:       #7A8085;
  --text-4:       #4E5358;

  --orange:       #FF6B00;
  --orange-hot:   #FF8A2B;
  --orange-deep:  #D95400;
  --orange-soft:  rgba(255,107,0,.12);
  --orange-glow:  rgba(255,107,0,.20);

  --green:        #1E9E4A;
  --green-hot:    #34B85E;
  --green-soft:   rgba(30,158,74,.12);

  --danger:       #E5484D;
  --danger-soft:  rgba(229,72,77,.12);

  --warning:      #E8A13A;
  --warning-soft: rgba(232,161,58,.12);

  --info:         #4A9DDB;
  --info-soft:    rgba(74,157,219,.12);

  --shadow-card:  0 1px 0 rgba(255,255,255,.03) inset,
                  0 20px 40px -20px rgba(0,0,0,.7);
  --shadow-lg:    0 40px 80px -20px rgba(0,0,0,.85);
}

/* LIGHT */
[data-theme="light"]{
  --canvas:       #F6F3EE;
  --surface:      #FFFFFF;
  --surface-2:    #F4F0E8;
  --surface-3:    #FAF7F1;
  --surface-hover:#EDE7DA;

  --line:         #E5DFD3;
  --line-2:       #D3CCBE;

  --text:         #14110D;
  --text-2:       #4A4339;
  --text-3:       #7A7365;
  --text-4:       #A69F92;

  --orange:       #E85D00;
  --orange-hot:   #FF7A1F;
  --orange-deep:  #B84800;
  --orange-soft:  rgba(232,93,0,.10);
  --orange-glow:  rgba(232,93,0,.18);

  --green:        #17803B;
  --green-hot:    #1E9E4A;
  --green-soft:   rgba(23,128,59,.10);

  --danger:       #B8342C;
  --danger-soft:  rgba(184,52,44,.10);

  --warning:      #B4730A;
  --warning-soft: rgba(180,115,10,.10);

  --info:         #2C6FA6;
  --info-soft:    rgba(44,111,166,.10);

  --shadow-card:  0 1px 0 rgba(255,255,255,.9) inset,
                  0 20px 40px -20px rgba(20,17,13,.15);
  --shadow-lg:    0 40px 80px -20px rgba(20,17,13,.25);
}

:root{
  --r-xs: 4px;
  --r-sm: 6px;
  --r:    10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --sidebar-w: 264px;
  --header-h:  64px;

  --font: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --font-mono: Consolas, Monaco, "Courier New", monospace;

  --ease: cubic-bezier(.22,.61,.36,1);
}

/* RESET */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }

body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  color:var(--text);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition: background .3s var(--ease), color .3s var(--ease);
}

button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }
a{ color:var(--orange); text-decoration:none; }
a:hover{ text-decoration:underline; }

:focus-visible{
  outline:2px solid var(--orange);
  outline-offset:2px;
  border-radius:var(--r-xs);
}

/* Skip link */
.skip-link{
  position:absolute;
  top:-100px;
  left:8px;
  z-index:9999;
  padding:10px 16px;
  background:var(--orange);
  color:#fff;
  border-radius:var(--r-sm);
  font-weight:700;
  transition: top .2s;
}
.skip-link:focus{ top:8px; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height:100vh;
  min-height:100dvh;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  position:sticky;
  top:0;
  overflow:hidden;
  transition: background .3s var(--ease), border-color .3s var(--ease);
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  min-height:var(--header-h);
  flex-shrink:0;
}
.sidebar-brand .logo{
  width:38px; height:38px;
  border-radius:9px;
  background:var(--surface-2);
  border:1px solid var(--line-2);
  display:grid; place-items:center;
  overflow:hidden;
  flex-shrink:0;
}
.sidebar-brand .logo img{
  width:70%; height:70%;
  object-fit:contain; display:block;
  /* Logo colours untouched */
}
.sidebar-brand .logo .fallback{
  font-size:18px; font-weight:800; color:var(--orange);
}
.sidebar-brand .name{
  display:flex; flex-direction:column;
  min-width:0;
  line-height:1.15;
}
.sidebar-brand .name strong{
  font-size:13px;
  font-weight:800;
  letter-spacing:.14em;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sidebar-brand .name span{
  font-size:10px;
  letter-spacing:.20em;
  text-transform:uppercase;
  color:var(--text-3);
  font-weight:600;
  margin-top:3px;
}

.sidebar-nav{
  flex:1;
  overflow-y:auto;
  padding:14px 10px 20px;
  scrollbar-width:thin;
  scrollbar-color: var(--line-2) transparent;
}
.sidebar-nav::-webkit-scrollbar{ width:6px; }
.sidebar-nav::-webkit-scrollbar-track{ background:transparent; }
.sidebar-nav::-webkit-scrollbar-thumb{
  background:var(--line-2);
  border-radius:3px;
}

.nav-group{ margin-bottom:6px; }

.nav-group-btn{
  appearance:none;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  background:transparent;
  border:0;
  border-radius:var(--r-sm);
  color:var(--text-2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  text-align:left;
  transition: color .15s, background .15s;
}
.nav-group-btn:hover{
  background:var(--surface-2);
  color:var(--text);
}
.nav-group-btn .chev{
  margin-left:auto;
  width:14px; height:14px;
  stroke:currentColor; fill:none;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  transition: transform .2s var(--ease);
  opacity:.5;
}
.nav-group-btn[aria-expanded="true"] .chev{
  transform: rotate(90deg);
  opacity:1;
}

.nav-items{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:2px 0 4px;
  overflow:hidden;
  max-height:0;
  transition: max-height .3s var(--ease);
}
.nav-group[data-open="true"] .nav-items{
  max-height:1000px;
}

.nav-item{
  appearance:none;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 12px;
  padding-left:14px;
  background:transparent;
  border:0;
  border-radius:var(--r-sm);
  color:var(--text-2);
  font-size:13.5px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  transition: color .15s, background .15s;
  position:relative;
  text-decoration:none;
}
.nav-item:hover{
  background:var(--surface-2);
  color:var(--text);
  text-decoration:none;
}
.nav-item.active{
  background:var(--orange-soft);
  color:var(--orange);
}
.nav-item.active::before{
  content:"";
  position:absolute;
  left:0; top:20%; bottom:20%;
  width:3px;
  background:var(--orange);
  border-radius:0 2px 2px 0;
}
.nav-item .ico{
  width:18px; height:18px;
  stroke:currentColor; fill:none;
  stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round;
  flex-shrink:0;
}
.nav-item .label{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.nav-item .badge{
  font-size:10px;
  font-weight:800;
  padding:2px 7px;
  border-radius:999px;
  background:var(--orange);
  color:#fff;
  letter-spacing:.04em;
}

.sidebar-foot{
  padding:14px;
  border-top:1px solid var(--line);
  flex-shrink:0;
}
.sidebar-foot .session-chip{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:var(--surface-2);
  border:1px solid var(--line-2);
  border-radius:var(--r);
}
.sidebar-foot .session-chip .dot{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--green-hot);
  box-shadow: 0 0 0 3px var(--green-soft);
  flex-shrink:0;
}
.sidebar-foot .session-chip .txt{
  display:flex; flex-direction:column;
  min-width:0; line-height:1.3;
}
.sidebar-foot .session-chip .txt strong{
  font-size:11px;
  color:var(--text);
  letter-spacing:.04em;
  font-weight:700;
}
.sidebar-foot .session-chip .txt span{
  font-size:10px;
  color:var(--text-3);
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:600;
  margin-top:2px;
}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main-col{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:100vh;
  min-height:100dvh;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:50;
  height:var(--header-h);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 22px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  transition: background .3s var(--ease), border-color .3s var(--ease);
}

.menu-btn{
  display:none;
  appearance:none;
  width:40px; height:40px;
  border-radius:var(--r-sm);
  background:transparent;
  border:1px solid var(--line-2);
  color:var(--text-2);
  place-items:center;
}
.menu-btn:hover{ color:var(--text); background:var(--surface-2); }
.menu-btn svg{
  width:18px; height:18px;
  stroke:currentColor; fill:none;
  stroke-width:1.8; stroke-linecap:round;
}

.header-titles{
  display:flex;
  flex-direction:column;
  min-width:0;
  line-height:1.2;
}
.header-titles .crumb{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-3);
  font-weight:700;
}
.header-titles h1{
  margin:2px 0 0;
  font-size:17px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:min(60vw, 480px);
}

.header-search{
  flex:1;
  max-width:380px;
  margin-left:20px;
  position:relative;
}
.header-search input{
  width:100%;
  height:38px;
  padding:0 12px 0 38px;
  border-radius:var(--r);
  background:var(--surface-2);
  border:1px solid var(--line-2);
  color:var(--text);
  font-size:13.5px;
  outline:none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.header-search input::placeholder{ color:var(--text-4); }
.header-search input:focus{
  border-color:var(--orange);
  background:var(--surface);
  box-shadow: 0 0 0 3px var(--orange-glow);
}
.header-search .sicon{
  position:absolute;
  left:12px; top:50%;
  transform:translateY(-50%);
  width:16px; height:16px;
  stroke:var(--text-3); fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  pointer-events:none;
}
.header-search kbd{
  position:absolute;
  right:8px; top:50%;
  transform:translateY(-50%);
  padding:2px 7px;
  border-radius:var(--r-xs);
  border:1px solid var(--line-2);
  background:var(--surface);
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--text-3);
  font-weight:600;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.icon-button{
  appearance:none;
  width:38px; height:38px;
  border-radius:var(--r-sm);
  background:transparent;
  border:1px solid transparent;
  color:var(--text-2);
  display:grid; place-items:center;
  transition: color .15s, background .15s, border-color .15s;
  position:relative;
}
.icon-button:hover{
  color:var(--text);
  background:var(--surface-2);
  border-color:var(--line-2);
}
.icon-button svg{
  width:18px; height:18px;
  stroke:currentColor; fill:none;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
}
.icon-button .dot-indicator{
  position:absolute;
  top:8px; right:8px;
  width:7px; height:7px;
  border-radius:50%;
  background:var(--orange);
  border:1.5px solid var(--surface);
}

.profile-trigger{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 12px 5px 5px;
  border-radius:999px;
  background:transparent;
  border:1px solid var(--line-2);
  color:var(--text);
  transition: background .15s, border-color .15s;
  margin-left:8px;
}
.profile-trigger:hover{
  background:var(--surface-2);
  border-color:var(--orange);
}
.profile-trigger .avatar{
  width:30px; height:30px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--orange), var(--orange-deep));
  color:#fff;
  display:grid; place-items:center;
  font-weight:800;
  font-size:12px;
  letter-spacing:.02em;
  flex-shrink:0;
}
.profile-trigger .who{
  display:flex; flex-direction:column;
  line-height:1.15;
  min-width:0;
  max-width:160px;
}
.profile-trigger .who strong{
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-trigger .who span{
  font-size:10px;
  color:var(--text-3);
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ============================================================
   WORKSPACE
   ============================================================ */
.workspace{
  flex:1;
  padding:24px 26px 40px;
  min-width:0;
  overflow-x:hidden;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.page-head .left{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
}
.page-head .eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  letter-spacing:.20em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--orange);
}
.page-head .eyebrow .live{
  width:6px; height:6px;
  border-radius:50%;
  background:var(--green-hot);
  animation: pulse 2s var(--ease) infinite;
}
@keyframes pulse{
  0%  { box-shadow: 0 0 0 0 rgba(30,158,74,.55); }
  70% { box-shadow: 0 0 0 10px rgba(30,158,74,0); }
  100%{ box-shadow: 0 0 0 0 rgba(30,158,74,0); }
}
.page-head h2{
  margin:0;
  font-size:clamp(20px, 2.4vw, 26px);
  font-weight:800;
  color:var(--text);
  letter-spacing:-.005em;
  line-height:1.2;
}
.page-head .sub{
  margin:0;
  font-size:14px;
  color:var(--text-2);
  line-height:1.5;
  max-width:60ch;
}
.page-head .right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

/* Buttons */
.btn{
  appearance:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  height:38px;
  padding:0 16px;
  border-radius:var(--r);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:.01em;
  border:1px solid transparent;
  transition: background .15s, border-color .15s, color .15s, transform .06s;
  text-decoration:none;
  white-space:nowrap;
}
.btn:active{ transform: translateY(1px); }
.btn svg{
  width:16px; height:16px;
  stroke:currentColor; fill:none;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;
}
.btn-primary{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
  box-shadow: 0 6px 18px -8px rgba(255,107,0,.5);
}
.btn-primary:hover{
  background:var(--orange-hot);
  border-color:var(--orange-hot);
  text-decoration:none;
}
.btn-ghost{
  background:var(--surface);
  border-color:var(--line-2);
  color:var(--text);
}
.btn-ghost:hover{
  border-color:var(--orange);
  color:var(--orange);
  text-decoration:none;
}
.btn-sm{ height:32px; padding:0 12px; font-size:12.5px; }

/* ============================================================
   METRICS GRID
   ============================================================ */
.metrics{
  display:grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap:14px;
  margin-bottom:24px;
}
@media (max-width:1200px){ .metrics{ grid-template-columns: repeat(3, 1fr); } }
@media (max-width:720px){ .metrics{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width:420px){ .metrics{ grid-template-columns: 1fr; } }

.metric{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  overflow:hidden;
  transition: border-color .15s, transform .15s;
}
.metric:hover{ border-color:var(--line-2); }
.metric .head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.metric .head .label{
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--text-3);
}
.metric .head .ico-wrap{
  width:32px; height:32px;
  border-radius:8px;
  display:grid; place-items:center;
  background:var(--orange-soft);
  color:var(--orange);
}
.metric .head .ico-wrap svg{
  width:16px; height:16px;
  stroke:currentColor; fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
}
.metric.green .ico-wrap{ background:var(--green-soft); color:var(--green); }
.metric.info .ico-wrap{ background:var(--info-soft); color:var(--info); }
.metric.warning .ico-wrap{ background:var(--warning-soft); color:var(--warning); }

.metric .value{
  font-size:30px;
  font-weight:800;
  color:var(--text);
  line-height:1;
  letter-spacing:-.01em;
}
.metric .value.muted{ color:var(--text-3); font-size:24px; }
.metric .foot{
  font-size:12px;
  color:var(--text-3);
  font-weight:600;
}
.metric.loading .value{
  display:inline-block;
  width:70px; height:30px;
  border-radius:6px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer{
  0%  { background-position: 200% 0; }
  100%{ background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce){
  .metric.loading .value{ animation:none; background:var(--surface-2); }
  .page-head .eyebrow .live{ animation:none; }
}

/* ============================================================
   CONTENT GRID
   ============================================================ */
.content-grid{
  display:grid;
  grid-template-columns: 2fr 1fr;
  gap:20px;
  align-items:start;
}
@media (max-width:1024px){ .content-grid{ grid-template-columns: 1fr; } }

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;

}

  flex-direction:column;
  align-items:center;
  gap:8px;
  padding-top:4px;
}
.activity-row .dot-col .dot{
  width:8px; height:8px;
  border-radius:50%;

  flex-shrink:0;
}
.activity-row .dot-col .dot.green{ background:var(--green-hot); }
.activity-row .dot-col .dot.info{ background:var(--info); }
.activity-row .dot-col .dot.warning{ background:var(--warning); }
.activity-row .dot-col .dot.danger{ background:var(--danger); }
.activity-row .text{
  flex:1;
  min-width:0;
}
.activity-row .text .line{
  font-size:13px;
  color:var(--text);
  font-weight:600;
  line-height:1.45;
}
.activity-row .text .line .actor{
  color:var(--orange);
  font-weight:700;
}
.activity-row .text .line .target{
  color:var(--text);
  font-weight:700;
}
.activity-row .text .meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:4px;
  font-size:11.5px;
  color:var(--text-3);
  font-weight:600;
  letter-spacing:.02em;
}
.activity-row .text .meta .sep{
  width:3px; height:3px;
  border-radius:50%;

}

.qa-grid{

}

.qa{

  align-items:center;
  gap:12px;
  padding:12px 14px;

  border:1px solid var(--line-2);

  transition: border-color .15s, background .15s, transform .08s;
}
.qa:hover{
  border-color:var(--orange);
  background:var(--surface-3);
}
.qa:active{ transform: translateY(1px); }
.qa .ico{
  width:32px; height:32px;

  background:var(--orange-soft);
  color:var(--orange);

}
.qa .ico svg{
  width:16px; height:16px;

  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
}
.qa .label{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  line-height:1.3;
}

/* System status rows */
.status-list{
  display:flex;
  flex-direction:column;
}
.status-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 20px;

}
.status-row:last-child{ border-bottom:0; }

}
.status-row .dot.green{ background:var(--green-hot); box-shadow: 0 0 0 3px var(--green-soft); }
.status-row .dot.orange{ background:var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }

.status-row .text{

.profile-menu .menu-head{

}
.profile-menu .menu-head span{

  font-weight:600;
  white-space:nowrap;

  text-overflow:ellipsis;
}
.profile-menu .menu-item{

  background:var(--surface-2);
  color:var(--orange);
  text-decoration:none;
}
.profile-menu .menu-item svg{

  stroke:currentColor; fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
}
.profile-menu .menu-divider{
  height:1px;
  background:var(--line);

}

/* ============================================================
   SCREEN-VIEWER LOADING (initial auth check)
   ============================================================ */
.auth-gate{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--canvas);
  transition: opacity .4s var(--ease), visibility .4s;
}
.auth-gate.done{
  opacity:0; visibility:hidden; pointer-events:none;
}
.auth-gate .gate-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.auth-gate .gate-ring{
  position:relative;
  width:64px; height:64px;
}
.auth-gate .gate-ring::before,
.auth-gate .gate-ring::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid transparent;
}
.auth-gate .gate-ring::before{
  border-top-color:var(--orange);
  border-right-color:var(--orange);
  animation: spin 1s linear infinite;
}
.auth-gate .gate-ring::after{
  inset:10px;
  border-bottom-color:var(--green);
  border-left-color:var(--green);
  animation: spin-r 1.4s linear infinite;
}
@keyframes spin  { to{ transform: rotate(360deg); } }
@keyframes spin-r{ to{ transform: rotate(-360deg); } }
.auth-gate .gate-text{
  font-size:11px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--text-3);
  font-weight:700;
}

/* Utility */
.hidden{ display:none !important; }

/* ============================================================
   THEME
   ============================================================ */
const THEMES = ['dark','light'];
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('almafaaz.theme', theme); }catch(e){}
  const next = theme === 'dark' ? 'light' : 'dark';
  themeMenuLabel.textContent = `Switch to ${next}`;
  themeBtn.setAttribute('aria-label', `Switch to ${next} theme`);
}
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || 'dark';
}
themeBtn.addEventListener('click', () => {
  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
});
themeMenuItem.addEventListener('click', () => {
  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  closeProfileMenu();
});
setTheme(currentTheme());

/* ============================================================
   MOBILE DRAWER
   ============================================================ */
function openDrawer(){
  sidebar.classList.add('open');
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function closeDrawer(){
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
  backdrop.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
menuBtn.addEventListener('click', openDrawer);
backdrop.addEventListener('click', closeDrawer);

/* ============================================================
   PROFILE MENU
   ============================================================ */
function openProfileMenu(){
  profileMenu.classList.add('open');
  profileMenu.setAttribute('aria-hidden','false');
  profileTrigger.setAttribute('aria-expanded','true');
}
function closeProfileMenu(){
  profileMenu.classList.remove('open');
  profileMenu.setAttribute('aria-hidden','true');
  profileTrigger.setAttribute('aria-expanded','false');
}
profileTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  profileMenu.classList.contains('open') ? closeProfileMenu() : openProfileMenu();
});
document.addEventListener('click', (e) => {
  if (!profileMenu.contains(e.target) && e.target !== profileTrigger){
    closeProfileMenu();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    closeProfileMenu();
    closeDrawer();
  }
  /* Focus search with "/" when not typing */
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
    e.preventDefault();
    searchInput && searchInput.focus();
  }
});
profileMenu.querySelectorAll('[data-nav]').forEach(el => {
  el.addEventListener('click', () => {
    navigate(el.dataset.nav);
    closeProfileMenu();
  });
});

   LOGOUT

logoutBtn.addEventListener('click', async () => {
  logoutBtn.disabled = true;
  try{ await supabase.auth.signOut(); }catch(_){}
  try{ localStorage.removeItem('almafaaz.auth'); }catch(_){}
  window.location.replace('../auth/login.html');
});

/* ============================================================
   SIDEBAR RENDERING
   ============================================================ */
function renderSidebar(){
  const nav = $('sidebar-nav');
  nav.innerHTML = NAV.map(group => `
    <div class="nav-group" data-open="${group.open ? 'true' : 'false'}">
      <button type="button" class="nav-group-btn"
              aria-expanded="${group.open ? 'true' : 'false'}"
              data-group="${group.id}">
        <span>${group.label}</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <div class="nav-items">
        ${group.items.map(it => `
          <a class="nav-item" data-route="${it.route}" href="#${it.route}">
            <span class="ico">${svg(it.icon)}</span>
            <span class="label">${it.label}</span>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');

  /* Group toggles */
  nav.querySelectorAll('.nav-group-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.closest('.nav-group');
      const open = group.dataset.open === 'true';
      group.dataset.open = open ? 'false' : 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
  });

  /* Nav items */
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(item.dataset.route);
      if (window.innerWidth <= 900) closeDrawer();
    });
  });

  highlightActiveNav();
}

function highlightActiveNav(){
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.route);
  });
}

/* ============================================================
   ROUTER — hash based, no page reloads
   ============================================================ */
function navigate(route){
  state.route = route;
  window.location.hash = route;
  render();
}

window.addEventListener('hashchange', () => {
  const r = window.location.hash.replace(/^#/, '') || 'dashboard';
  state.route = r;
  render();
});

function findNavMeta(route){
  for (const group of NAV){
    for (const item of group.items){
      if (item.route === route){
        return { group: group.label, item };
      }
    }
  }
  return null;
}

/* ============================================================
   RENDER
   ============================================================ */

  const meta = findNavMeta(state.route);

    state.route = 'dashboard';

  switch (state.route){
    case 'dashboard':       renderDashboard(); break;

                ${svg('calendar')} Manage sessions
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  `;

  /* Wire refresh + quick actions */
  workspace.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.nav));
  });
  workspace.querySelectorAll('[data-action="refresh"]').forEach(el => {
    el.addEventListener('click', () => loadDashboardData());
  });

  /* Welcome line personalization */
  const w = $('welcome-line');
  if (w && state.profile){
    const name = state.profile.full_name || state.profile.email || 'Administrator';
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    w.textContent = `${greet}, ${name.split(' ')[0]}`;
  }

  /* Load live data */
  loadDashboardData();
}

function metricCard(id, label, icon, variant){
  return `
    <div class="metric ${variant || ''}" data-metric="${id}">
      <div class="head">
        <span class="label">${label}</span>
        <span class="ico-wrap">${svg(icon)}</span>
      </div>
      <div class="value loading" data-value="${id}">—</div>
      <div class="foot" data-foot="${id}">Loading…</div>
    </div>
  `;
}

/* ============================================================
   DASHBOARD DATA — real Supabase counts
   ============================================================ */
async function loadDashboardData(){
  await Promise.all([
    loadCount('students',          'students',          'students registered'),
    loadCount('teachers',          'teachers',          'teachers on record'),
    loadCount('staff',             'staff',             'staff members'),
    loadCount('classes',           'classes',           'active classes'),
    loadCount('cbt',               'cbt_examinations',  'CBT examinations'),
    loadAcademicContext(),
    loadRecentActivity()
  ]);
}

async function loadCount(metricId, table, noun){
  const valueEl = document.querySelector(`[data-value="${metricId}"]`);
  const footEl  = document.querySelector(`[data-foot="${metricId}"]`);
  if (!valueEl) return;

  try{
    const { count, error } = await supabase
      .from(table)
      .select('*', { count:'exact', head:true });

    if (error) throw error;

    valueEl.classList.remove('loading');
    valueEl.textContent = count ?? 0;
    if (count === 0){
      valueEl.classList.add('muted');
      if (footEl) footEl.textContent = `No ${noun} yet`;
    } else {
      if (footEl) footEl.textContent = noun;
    }
  } catch(err){
    console.error(`[dashboard] count(${table}) failed`, err);
    valueEl.classList.remove('loading');
    valueEl.textContent = '—';
    if (footEl) footEl.textContent = 'Unable to load';
  }
}

async function loadAcademicContext(){
  try{
    const [{ data: session }, { data: term }] = await Promise.all([
      supabase.from('academic_sessions').select('name').eq('is_active', true).maybeSingle(),
      supabase.from('terms').select('name').eq('is_active', true).maybeSingle()
    ]);

    const sName = session?.name || null;
    const tName = term?.name  || null;

    state.sessionName = sName;
    state.termName    = tName;

    const set = (id, val, fallback) => {
      const el = document.getElementById(id);
      if (el) el.textContent = val || fallback;
    };

    set('session-name', sName ? `${sName} session` : 'No active session', 'No active session');
    set('session-term', tName ? tName : 'Set up academics', 'Set up academics');
    set('ctx-session',  sName, '—');
    set('ctx-term',     tName, '—');

    const sSess = document.getElementById('status-session');
    const sTerm = document.getElementById('status-term');
    if (sSess) { sSess.textContent = sName ? sName : 'Not set'; sSess.className = 'state ' + (sName ? 'ok' : 'warn'); }
    if (sTerm) { sTerm.textContent = tName ? tName : 'Not set'; sTerm.className = 'state ' + (tName ? 'ok' : 'warn'); }
  } catch(err){
    console.error('[dashboard] academic context failed', err);
  }
}

async function loadRecentActivity(){
  const panel = document.getElementById('activity-panel');
  if (!panel) return;
  try{
    const { data, error } = await supabase
      .from('audit_logs')
      .select('id, actor_email, action, target_type, target_email, created_at')
      .order('created_at', { ascending:false })
      .limit(10);

    if (error) throw error;

    if (!data || data.length === 0){
      panel.innerHTML = `
        <div class="empty">
          <div class="ico-wrap">${svg('activity')}</div>
          <h4>No activity recorded yet</h4>
          <p>When you create students, teachers, or make administrative changes, they'll appear here.</p>
        </div>`;
      return;
    }

    panel.innerHTML = `
      <div class="activity-list">
        ${data.map(row => `
          <div class="activity-row">
            <div class="dot-col"><span class="dot"></span></div>
            <div class="text">
              <div class="line">
                <span class="actor">${escapeHtml(row.actor_email || 'System')}</span>
                ${humanAction(row.action)}
                ${row.target_email ? `<span class="target">${escapeHtml(row.target_email)}</span>` : ''}
              </div>
              <div class="meta">
                <span>${timeAgo(row.created_at)}</span>
                ${row.target_type ? `<span class="sep"></span><span>${escapeHtml(row.target_type)}</span>` : ''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch(err){
    console.error('[dashboard] activity failed', err);
    panel.innerHTML = `
      <div class="empty">
        <div class="ico-wrap">${svg('activity')}</div>
        <h4>Unable to load activity</h4>
        <p>There was a problem reaching the activity log. Please try again shortly.</p>
      </div>`;
  }
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function humanAction(action){
  if (!action) return 'performed an action';
  const map = {
    'user.created': 'created an account for',
    'user.role_changed': 'changed the role of',
    'user.activated': 'activated the account of',
    'user.deactivated': 'deactivated the account of',
    'user.password_reset': 'reset the password for',
    'user.deleted': 'deleted the account of'
  };
  return map[action] || action.replace(/[._]/g,' ');
}

function timeAgo(iso){
  try{
    const then = new Date(iso).getTime();
    const now  = Date.now();
    const sec  = Math.floor((now - then) / 1000);
    if (sec < 45) return 'just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min} min ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr} hr${hr === 1 ? '' : 's'} ago`;
    const d = Math.floor(hr / 24);
    if (d < 30) return `${d} day${d === 1 ? '' : 's'} ago`;
    return new Date(iso).toLocaleDateString();
  } catch(_){ return '—'; }
}

/* ============================================================
   AUTH GUARD — first thing the page does
   ============================================================ */
async function boot(){
  try{
    /* 1. Session check */
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user){
      return redirectToLogin('no-session');
    }

    /* 2. Fetch profile via RPC (bypasses RLS, auto-creates if missing) */
    const { data: rows, error: rpcErr } = await supabase.rpc('get_my_profile');
    if (rpcErr){
      console.error('[dashboard] get_my_profile failed', rpcErr);
      return redirectToLogin('profile-error');
    }

    const profile = Array.isArray(rows) ? rows[0] : rows;
    if (!profile){
      return redirectToLogin('no-profile');
    }
    if (!profile.is_active){
      return redirectToLogin('inactive');
    }
    if (profile.role !== 'super_admin'){
      /* Non-super-admins should never see this dashboard */
      return redirectToLogin('not-super-admin');
    }

    /* 3. All checks passed */
    state.user = session.user;
    state.profile = profile;

    populateIdentity(profile);
    renderSidebar();
    render();

    /* Reveal */
    authGate.classList.add('done');
    app.style.display = 'grid';

    /* If route came in via hash, honor it */
    const hash = window.location.hash.replace(/^#/, '');
    if (hash && hash !== state.route){
      navigate(hash);
    }

  } catch(err){
    console.error('[dashboard] boot failed', err);
    redirectToLogin('boot-failed');
  }
}

function populateIdentity(profile){
  const name  = profile.full_name || profile.email || 'Super Admin';
  const email = profile.email || '—';
  const role  = profile.role === 'super_admin' ? 'Super Administrator' : profile.role;

  const initials = (name.match(/\b\w/g) || ['S','A']).slice(0, 2).join('').toUpperCase();
  $('avatar-initials').textContent = initials;
  $('profile-name').textContent = name;
  $('profile-role').textContent = role;
  $('menu-name').textContent = name;
  $('menu-email').textContent = email;

  /* Welcome line — if dashboard renders after profile is set */
  const w = $('welcome-line');
  if (w){
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    w.textContent = `${greet}, ${name.split(' ')[0]}`;
  }
}

function redirectToLogin(reason){
  console.warn('[dashboard] redirecting to login:', reason);
  /* Do not render anything; go to login */
  try{ window.location.replace('../auth/login.html'); }catch(_){}
}

/* ============================================================
   WATCH AUTH STATE — real-time session changes
   ============================================================ */
supabase.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT'){
    redirectToLogin('signed-out');
  }
});

/* ============================================================
   GO
   ============================================================ */
boot();
</script>
